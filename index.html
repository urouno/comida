<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Alimentación</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Alimentación">
<meta name="theme-color" content="#FBFBFD">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* ============================================================
   SISTEMA DE DISEÑO
   Paleta neutra + un solo color de acento (#0071E3), reservado
   para lo que se toca. Una sola familia tipográfica: la del
   sistema. Todos los espacios en múltiplos de 8.
   ============================================================ */
:root{
  --fondo:#FBFBFD; --superficie:#F5F5F7; --texto:#1D1D1F; --suave:#6E6E73;
  --acento:#0071E3; --borde:#D2D2D7; --alerta:#B3261E;
  --p1:#1D1D1F; --p2:#8E8E93; --p3:#D2D2D7;
  --e1:8px; --e2:16px; --e3:24px; --e4:32px; --e5:48px;
  --r1:12px; --r2:16px; --r3:20px;
  --tipo:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --display:32px; --titulo:20px; --cuerpo:15px; --secundario:13px; --etiqueta:11px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--tipo);font-size:var(--cuerpo);color:var(--texto);
  background:var(--superficie);min-height:100vh;display:flex;justify-content:center;
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.app{width:100%;max-width:430px;background:var(--fondo);min-height:100vh;
  display:flex;flex-direction:column;position:relative}

/* ---------- encabezado ---------- */
header{position:sticky;top:0;z-index:30;background:var(--fondo);
  padding:max(var(--e1),env(safe-area-inset-top)) var(--e3) var(--e2);
  border-bottom:1px solid var(--borde)}
.fecha-fila{display:flex;align-items:center;gap:var(--e1);margin-bottom:var(--e2)}
.flecha{width:44px;height:44px;border:0;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex:none;border-radius:var(--r1)}
.flecha svg{width:18px;height:18px;stroke:var(--acento);fill:none;stroke-width:2.2}
.flecha:disabled svg{stroke:var(--borde)}
.flecha:active{background:var(--superficie)}
.fecha{flex:1;text-align:center;border:0;background:none;cursor:pointer;padding:var(--e1) 0;
  font-family:var(--tipo);font-size:var(--cuerpo);font-weight:600;color:var(--texto);line-height:1.2}
.fecha span{display:block;font-size:var(--etiqueta);font-weight:600;color:var(--suave);
  text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.titulo-seccion{flex:1;font-size:var(--titulo);font-weight:700;letter-spacing:-.01em}
.ajustes{width:44px;height:44px;border:0;background:none;cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;border-radius:var(--r1);position:relative}
.ajustes svg{width:21px;height:21px;stroke:var(--acento);fill:none;stroke-width:1.8}
.ajustes:active{background:var(--superficie)}
.punto{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;
  border:1.5px solid var(--fondo)}
.punto.esp{background:var(--suave)}
.punto.ok,.punto.no{display:none}

.marcador{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--e2)}
.gran{font-size:var(--display);font-weight:700;letter-spacing:-.02em;line-height:1}
.gran.alto{color:var(--alerta)}
.bajo-gran{font-size:var(--etiqueta);font-weight:600;color:var(--suave);
  text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.restante{text-align:right;font-size:var(--secundario);color:var(--suave);line-height:1.35;flex:none}
.restante b{display:block;font-size:var(--cuerpo);font-weight:600;color:var(--texto)}
.barra{height:6px;background:var(--borde);border-radius:3px;overflow:hidden;position:relative;
  margin:var(--e2) 0}
.barra i{position:absolute;top:0;left:0;height:100%;border-radius:3px;transition:width .3s ease}
.barra .plan{background:#C7C7CC}
.barra .real{background:var(--texto)}
.barra .real.alto{background:var(--alerta)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--e2);margin-bottom:var(--e2)}
.macro .et{font-size:var(--etiqueta);font-weight:600;color:var(--suave);text-transform:uppercase;
  letter-spacing:.04em;display:flex;justify-content:space-between;gap:4px;margin-bottom:5px}
.macro .et b{color:var(--texto);font-weight:600}
.macro .tr{height:4px;background:var(--borde);border-radius:2px;overflow:hidden}
.macro .tr i{display:block;height:100%;background:var(--p2);border-radius:2px;transition:width .3s}
.macro.lleno .tr i{background:var(--texto)}
.instruccion{font-size:var(--secundario);color:var(--suave);line-height:1.45}
.instruccion b{color:var(--texto);font-weight:600}

/* ---------- cuerpo ---------- */
main{flex:1;padding:var(--e3) var(--e3) calc(96px + env(safe-area-inset-bottom));
  background:var(--superficie)}
.vista{display:none}.vista.on{display:block}
.rotulo{font-size:var(--etiqueta);font-weight:600;color:var(--suave);text-transform:uppercase;
  letter-spacing:.06em;margin:0 0 var(--e2) 4px}
.rotulo.sep{margin-top:var(--e5)}

/* ---------- tarjeta de comida ---------- */
.comida{background:var(--fondo);border-radius:var(--r2);margin-bottom:var(--e2);overflow:hidden}
.c-cab{display:flex;align-items:center;gap:var(--e2);padding:var(--e3);width:100%;border:0;
  background:none;cursor:pointer;text-align:left;font-family:var(--tipo);min-height:72px}
.c-nom{flex:1;min-width:0}
.c-nom b{display:block;font-size:var(--cuerpo);font-weight:600;color:var(--suave);line-height:1.3}
.comida.llena .c-nom b{color:var(--texto)}
.c-nom span{display:block;font-size:var(--secundario);color:var(--suave);margin-top:2px}
.c-tot{text-align:right;flex:none;font-size:var(--secundario);color:var(--suave);line-height:1.35}
.c-tot b{display:block;font-size:var(--cuerpo);font-weight:600;color:var(--texto)}
.mas-ico{width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center}
.mas-ico svg{width:20px;height:20px;stroke:var(--acento);fill:none;stroke-width:2}
.renglon{display:flex;align-items:center;gap:var(--e2);padding:var(--e2) var(--e3);
  border-top:1px solid var(--superficie)}
.marca{width:28px;height:28px;flex:none;border-radius:50%;border:1.5px solid var(--borde);
  background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.marca svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3;opacity:0}
.renglon.comido .marca{background:var(--acento);border-color:var(--acento)}
.renglon.comido .marca svg{opacity:1}
.r-txt{flex:1;min-width:0;border:0;background:none;text-align:left;cursor:pointer;
  font-family:var(--tipo);padding:4px 0}
.r-txt b{display:block;font-size:var(--cuerpo);font-weight:400;color:var(--texto);line-height:1.35}
.renglon:not(.comido) .r-txt b{color:var(--suave)}
.r-txt span{display:block;font-size:var(--secundario);color:var(--suave);margin-top:2px}

/* ---------- semana ---------- */
.dia{display:flex;align-items:center;gap:var(--e3);width:100%;border:0;background:var(--fondo);
  border-radius:var(--r2);margin-bottom:var(--e1);padding:var(--e3);cursor:pointer;text-align:left;
  font-family:var(--tipo);min-height:76px}
.dia.hoy{box-shadow:inset 0 0 0 2px var(--acento)}
.d-num{flex:none;width:40px;text-align:center}
.d-num b{display:block;font-size:var(--titulo);font-weight:600;line-height:1}
.d-num span{display:block;font-size:var(--etiqueta);font-weight:600;color:var(--suave);
  text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.d-info{flex:1;min-width:0}
.d-info .bb{display:block;height:4px;background:var(--borde);border-radius:2px;overflow:hidden;
  margin-bottom:var(--e1)}
.d-info .bb i{display:block;height:100%;background:var(--texto);border-radius:2px}
.d-info small{display:block;font-size:var(--secundario);color:var(--suave);line-height:1.35}
.d-tot{flex:none;text-align:right;font-size:var(--secundario);color:var(--suave);line-height:1.35}
.d-tot b{display:block;font-size:var(--cuerpo);font-weight:600;color:var(--texto)}

/* ---------- listas ---------- */
.lista{background:var(--fondo);border-radius:var(--r2);overflow:hidden}
.ing{display:flex;align-items:center;gap:var(--e2);width:100%;border:0;background:none;
  cursor:pointer;padding:var(--e2) var(--e3);text-align:left;font-family:var(--tipo);min-height:56px}
.ing+.ing{border-top:1px solid var(--superficie)}
.caja{width:24px;height:24px;flex:none;border-radius:6px;border:1.5px solid var(--borde);
  display:flex;align-items:center;justify-content:center}
.caja svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3;opacity:0}
.ing.ok .caja{background:var(--acento);border-color:var(--acento)}
.ing.ok .caja svg{opacity:1}
.ing .nm{flex:1;font-size:var(--cuerpo)}
.ing.ok .nm{color:var(--suave);text-decoration:line-through}
.ing .ct{flex:none;font-size:var(--secundario);color:var(--suave)}

/* ---------- buscador y filtros ---------- */
.buscar{position:relative;margin-bottom:var(--e2)}
.buscar input{width:100%;min-height:44px;padding:var(--e1) var(--e2) var(--e1) 40px;
  border:1px solid var(--borde);border-radius:var(--r1);background:var(--fondo);
  font-family:var(--tipo);font-size:16px;color:var(--texto);-webkit-appearance:none}
.buscar input:focus{outline:0;border-color:var(--acento)}
.buscar svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;
  stroke:var(--suave);fill:none;stroke-width:2;pointer-events:none}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:var(--e2);padding-bottom:4px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--borde);background:var(--fondo);border-radius:20px;
  padding:7px 14px;font-family:var(--tipo);font-size:var(--secundario);color:var(--texto);
  cursor:pointer;min-height:36px}
.chips button[aria-selected=true]{background:var(--texto);border-color:var(--texto);color:#fff}

/* ---------- opciones ---------- */
.op{display:flex;align-items:center;gap:var(--e2);width:100%;border:0;background:none;
  cursor:pointer;padding:var(--e2) 0;text-align:left;font-family:var(--tipo);min-height:60px}
.op+.op{border-top:1px solid var(--superficie)}
.op.caja-f{padding:var(--e2) var(--e3);background:var(--fondo)}
.op .marca{width:24px;height:24px}
.op .nm{flex:1;min-width:0}
.op .nm b{display:block;font-size:var(--cuerpo);font-weight:400;line-height:1.35}
.op .nm span{display:block;font-size:var(--secundario);color:var(--suave);margin-top:2px}
.op .kc{flex:none;text-align:right;font-size:var(--secundario);color:var(--suave);line-height:1.35}
.op .kc b{display:block;font-size:var(--cuerpo);font-weight:400;color:var(--texto)}
.op[aria-pressed=true] .nm b{font-weight:600}
.op .ir{width:18px;height:18px;flex:none}
.op .ir svg{width:18px;height:18px;stroke:var(--borde);fill:none;stroke-width:2}

/* ---------- vacíos y botones ---------- */
.vacio{text-align:center;padding:var(--e5) var(--e3);color:var(--suave);
  font-size:var(--secundario);line-height:1.5}
.vacio b{display:block;font-size:var(--cuerpo);color:var(--texto);margin-bottom:var(--e1)}
.btn{width:100%;min-height:50px;border:0;border-radius:var(--r1);cursor:pointer;
  font-family:var(--tipo);font-size:var(--cuerpo);font-weight:600;
  background:var(--acento);color:#fff;padding:var(--e2)}
.btn:active{opacity:.85}
.btn[disabled]{background:var(--borde);color:var(--suave)}
.btn.texto{background:none;color:var(--acento);font-weight:400;min-height:44px}
.btn.texto:active{background:var(--superficie)}
.btn.peligro{background:none;color:var(--alerta);font-weight:400;min-height:44px}
.btn+.btn{margin-top:7px}

/* ---------- hoja inferior ---------- */
.hoja{position:fixed;inset:0;z-index:60;display:none}
.hoja.on{display:block}
.velo{position:absolute;inset:0;background:rgba(0,0,0,.28)}
.panel{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
  max-height:92vh;background:var(--fondo);border-radius:var(--r3) var(--r3) 0 0;
  display:flex;flex-direction:column;overflow:hidden}
.asa{width:36px;height:5px;background:var(--borde);border-radius:3px;margin:var(--e1) auto 0;flex:none}
.h-cab{padding:var(--e2) var(--e3) var(--e2);flex:none}
.h-nav{display:flex;align-items:center;min-height:36px;margin-bottom:var(--e1)}
.h-atras{border:0;background:none;cursor:pointer;font-family:var(--tipo);font-size:var(--cuerpo);
  color:var(--acento);display:flex;align-items:center;gap:4px;padding:var(--e1) var(--e1) var(--e1) 0;
  margin-left:-4px}
.h-atras svg{width:16px;height:16px;stroke:var(--acento);fill:none;stroke-width:2.4}
.h-cerrar{margin-left:auto;border:0;background:none;cursor:pointer;font-family:var(--tipo);
  font-size:var(--cuerpo);color:var(--acento);padding:var(--e1) 0 var(--e1) var(--e1)}
.pasos{display:flex;gap:4px;margin-bottom:var(--e2)}
.pasos i{flex:1;height:3px;border-radius:2px;background:var(--borde)}
.pasos i.on{background:var(--acento)}
.h-paso{font-size:var(--etiqueta);font-weight:600;color:var(--acento);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:var(--e1)}
.h-cab h2{font-size:var(--titulo);font-weight:600;letter-spacing:-.01em;line-height:1.25}
.h-cab p{font-size:var(--secundario);color:var(--suave);line-height:1.45;margin-top:var(--e1)}
.h-cab p b{color:var(--texto);font-weight:600}
.h-cuerpo{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 var(--e3) var(--e3)}
.h-pie{flex:none;padding:var(--e2) var(--e3) calc(var(--e2) + env(safe-area-inset-bottom));
  border-top:1px solid var(--borde);background:var(--fondo)}

/* ---------- plato ---------- */
.plato{padding:var(--e3) 0 var(--e2)}
.plato .cifras b{display:block;font-size:var(--display);font-weight:700;letter-spacing:-.02em;line-height:1}
.plato .cifras span{display:block;font-size:var(--secundario);color:var(--suave);margin-top:6px}
.regla{display:flex;flex-wrap:wrap;gap:var(--e1);margin-bottom:var(--e2)}
.parte{display:flex;align-items:center;gap:6px;font-size:var(--secundario);
  background:var(--superficie);border-radius:var(--r1);padding:6px 12px}
.parte i{width:8px;height:8px;border-radius:50%;flex:none;border:1.5px solid var(--borde)}
.parte.si i{border-color:transparent}
.parte.no{color:var(--suave)}
.partes{list-style:none;border-top:1px solid var(--superficie)}
.partes li{display:flex;align-items:center;gap:var(--e1);border-bottom:1px solid var(--superficie)}
.partes li .cuerpo{flex:1;min-width:0;display:flex;align-items:flex-start;gap:var(--e2);
  border:0;background:none;text-align:left;cursor:pointer;font-family:var(--tipo);padding:var(--e2) 0}
.partes li i{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
.partes li .t{flex:1;min-width:0}
.partes li .t b{display:block;font-size:var(--cuerpo);font-weight:400;line-height:1.35}
.partes li .t span{display:block;font-size:var(--secundario);color:var(--suave);margin-top:2px}
.partes li .cambiar{flex:none;font-size:var(--etiqueta);font-weight:600;color:var(--acento);
  text-transform:uppercase;letter-spacing:.05em;pointer-events:none}
.partes.simple{margin-top:var(--e2)}
.consejo{font-size:var(--secundario);color:var(--suave);line-height:1.5;
  background:var(--superficie);border-radius:var(--r1);padding:var(--e2);margin-top:var(--e3)}
.cuantas{font-size:var(--secundario);color:var(--suave);text-align:center;margin-top:var(--e2)}
.porcion-sel{display:flex;gap:6px;margin-top:var(--e3)}
.porcion-sel button{flex:1;border:1px solid var(--borde);background:var(--fondo);border-radius:var(--r1);
  padding:10px 2px;font-family:var(--tipo);font-size:var(--secundario);color:var(--texto);
  cursor:pointer;min-height:44px}
.porcion-sel button[aria-selected=true]{background:var(--texto);border-color:var(--texto);color:#fff}
.desglose{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--e1);margin-top:var(--e2)}
.desglose div{background:var(--superficie);border-radius:var(--r1);padding:var(--e2) var(--e1);
  text-align:center}
.desglose b{display:block;font-size:var(--cuerpo);font-weight:600}
.desglose span{display:block;font-size:var(--etiqueta);color:var(--suave);text-transform:uppercase;
  letter-spacing:.05em;margin-top:3px}

/* ---------- constructor ---------- */
.objetivo{display:flex;align-items:center;justify-content:space-between;gap:var(--e2);
  background:var(--superficie);border-radius:var(--r1);padding:var(--e2);margin-bottom:var(--e2)}
.objetivo .ob-t{font-size:var(--secundario);color:var(--suave)}
.objetivo .ob-t b{display:block;font-size:var(--titulo);font-weight:700;color:var(--texto);
  letter-spacing:-.01em;margin-top:2px}
.objetivo input{width:92px;min-height:40px;padding:var(--e1);border:1px solid var(--borde);
  border-radius:10px;background:var(--fondo);font-family:var(--tipo);font-size:16px;
  text-align:center;color:var(--texto);-webkit-appearance:none}
.objetivo input:focus{outline:0;border-color:var(--acento)}
.armado{list-style:none;margin-bottom:var(--e2)}
.armado li{display:flex;align-items:center;gap:var(--e1);padding:var(--e2) 0;
  border-bottom:1px solid var(--superficie)}
.armado .nm{flex:1;min-width:0;border:0;background:none;text-align:left;cursor:pointer;
  font-family:var(--tipo);padding:0}
.armado .nm b{display:block;font-size:var(--cuerpo);font-weight:400;line-height:1.3}
.armado .nm span{display:block;font-size:var(--etiqueta);color:var(--suave);margin-top:2px}
.armado .cant{flex:none;display:flex;align-items:center;gap:3px}
.armado .cant input{width:50px;min-height:38px;padding:4px;border:1px solid var(--borde);
  border-radius:8px;background:var(--fondo);font-family:var(--tipo);font-size:16px;
  text-align:center;color:var(--texto);-webkit-appearance:none;font-variant-numeric:tabular-nums}
.armado .cant input:focus{outline:0;border-color:var(--acento)}
.armado .cant em{font-style:normal;font-size:var(--etiqueta);color:var(--suave);width:24px}
.armado .quitar{width:32px;height:32px;flex:none;border:0;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.armado .quitar svg{width:15px;height:15px;stroke:var(--suave);fill:none;stroke-width:2}
.falta{display:flex;align-items:baseline;justify-content:space-between;gap:var(--e2);
  padding:var(--e2) 0;border-top:1px solid var(--borde)}
.falta b{font-size:var(--titulo);font-weight:700;letter-spacing:-.01em}
.falta b.alto{color:var(--alerta)}
.falta span{font-size:var(--secundario);color:var(--suave)}

/* ---------- campos ---------- */
.campo{margin-bottom:var(--e3)}
.campo label{display:block;font-size:var(--etiqueta);font-weight:600;color:var(--suave);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:var(--e1)}
.campo input,.campo select{width:100%;min-height:48px;padding:var(--e2);border:1px solid var(--borde);
  border-radius:var(--r1);background:var(--fondo);font-family:var(--tipo);font-size:16px;
  color:var(--texto);-webkit-appearance:none}
.campo input:focus,.campo select:focus{outline:0;border-color:var(--acento)}
.campo small{display:block;font-size:var(--secundario);color:var(--suave);margin-top:var(--e1);line-height:1.45}
.par{display:grid;grid-template-columns:1fr 1fr;gap:var(--e2)}
.tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--e1)}

/* ---------- datos y menús ---------- */
.dato{display:flex;justify-content:space-between;align-items:baseline;gap:var(--e2);
  padding:var(--e2) 0;border-bottom:1px solid var(--superficie);font-size:var(--cuerpo)}
.dato:last-of-type{border-bottom:0}
.dato .k{color:var(--suave);font-size:var(--secundario)}
.dato .v{font-weight:600;flex:none}
.dato .v.mal{color:var(--alerta)}
.menu{display:flex;align-items:center;gap:var(--e2);width:100%;border:0;background:none;
  cursor:pointer;padding:var(--e3) 0;text-align:left;font-family:var(--tipo);min-height:60px}
.menu+.menu{border-top:1px solid var(--superficie)}
.menu .nm{flex:1;font-size:var(--cuerpo)}
.menu .ex{font-size:var(--secundario);color:var(--suave)}
.menu svg{width:18px;height:18px;stroke:var(--borde);fill:none;stroke-width:2;flex:none}
.bloque{margin-bottom:var(--e5)}
.bloque h3{font-size:var(--cuerpo);font-weight:600;margin-bottom:var(--e1)}
.bloque p{font-size:var(--secundario);color:var(--suave);line-height:1.55;margin-bottom:var(--e2)}
.bloque p b{color:var(--texto);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--borde);padding:3px;
  border-radius:var(--r1);margin-bottom:var(--e3)}
.seg button{border:0;border-radius:9px;background:none;cursor:pointer;padding:9px 4px;
  font-family:var(--tipo);font-size:var(--secundario);font-weight:600;color:var(--suave);min-height:38px}
.seg button[aria-selected=true]{background:var(--fondo);color:var(--texto)}
.sep-lin{border:0;border-top:1px solid var(--borde);margin:var(--e3) 0}

/* ---------- barra inferior ---------- */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
  display:grid;grid-template-columns:repeat(4,1fr);background:var(--fondo);
  border-top:1px solid var(--borde);z-index:40;
  padding:var(--e1) 0 max(var(--e1),env(safe-area-inset-bottom))}
nav button{background:none;border:0;cursor:pointer;padding:var(--e1) 0;display:flex;
  flex-direction:column;align-items:center;gap:4px;color:var(--suave);font-family:var(--tipo);
  font-size:var(--etiqueta);font-weight:500;min-height:44px}
nav button[aria-selected=true]{color:var(--acento)}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav button[aria-selected=true] svg{stroke-width:2.2}

#aviso{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));
  transform:translateX(-50%);background:var(--texto);color:var(--fondo);font-size:var(--secundario);
  font-weight:500;padding:12px 20px;border-radius:24px;z-index:80;opacity:0;pointer-events:none;
  transition:opacity .18s ease;max-width:300px;text-align:center}
#aviso.on{opacity:1}

button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function nutre(nombre,cant){
  const a=buscar(nombre);
  if(!a) return {k:0,p:0,c:0,g:0};
  const base=num(a.cantidad,1)||1, f=num(cant,1)/base;
  return {k:num(a.kcal)*f, p:num(a.proteina)*f, c:num(a.carbos)*f, g:num(a.grasas)*f};
}
function totalItems(items){
  let k=0,p=0,c=0,g=0;
  (items||[]).forEach(x=>{const t=nutre(x[0],x[1]); k+=t.k;p+=t.p;c+=t.c;g+=t.g});
  return {k:Math.round(k),p:Math.round(p),c:Math.round(c),g:Math.round(g)};
}
function cantTexto(nombre,cant){
  const a=buscar(nombre); if(!a) return '';
  if(a.unidad==='porción'){
    const q=num(cant,1);
    if(q===1) return a.porcion;
    const etq={0.25:'¼',0.5:'½',0.75:'¾',1.5:'1½',2:'2',3:'3'}[q]||String(Math.round(q*100)/100);
    return etq+' × '+a.porcion;
  }
  return (Math.round(num(cant)*10)/10)+' '+a.unidad;
}
function desdeDescripcion(desc){
  const partes=String(desc||'').split(' · ').map(s=>s.trim()).filter(Boolean);
  if(!partes.length) return null;
  const items=[];
  for(let i=0;i<partes.length;i++){ const a=buscar(partes[i]); if(!a) return null;
    items.push([a.nombre,num(a.cantidad,1)]); }
  return items;
}

/* ================= METAS ================= */
function metas(){
  const p=E.perfil, pe=num(p.peso,84), es=num(p.estatura,178), ed=num(p.edad,27);
  const muj=String(p.sexo).toLowerCase().indexOf('muj')===0;
  const base=muj? 10*pe+6.25*es-5*ed-161 : 10*pe+6.25*es-5*ed+5;
  const gasto=base*num(p.actividad,1.3);
  const kcal=Math.max(1300,Math.round((gasto-num(p.ritmo,550))/10)*10);
  const prot=Math.round(num(p.peso_meta,75)*num(p.prot_por_kg,1.8));
  const gra=Math.round(kcal*(num(p.pct_grasa,30)/100)/9);
  const car=Math.max(0,Math.round((kcal-4*prot-9*gra)/4));
  return {gasto:Math.round(gasto),kcal,prot,car,gra};
}

/* ================= MOTOR DE PLATOS ================= */
function ideas(T,elegidos){
  if(!elegidos.length) return [];
  const M=metas(), min=M.kcal*T.fk[0], max=M.kcal*T.fk[1], metaP=M.prot*T.fp;
  if(T.solo) return elegidos.map(n=>{
    const a=buscar(n), items=[[n,num(a.cantidad,1)]], t=totalItems(items);
    return {items,comb:[n],k:t.k,p:t.p,c:t.c,g:t.g}});

  const listas=[elegidos].concat(T.relleno.map(c=>{
    const l=porCat(c).map(a=>a.nombre);
    if(NULOS[c]&&l.indexOf(NULOS[c])<0) l.push(NULOS[c]);
    if(OPCIONALES.indexOf(c)>=0) l.push('');
    return l;}));
  let out=[[]];
  listas.forEach(l=>{out=out.flatMap(p=>l.map(x=>p.concat([x])))});

  const FAMS=['pollo','atún','huevo','frijol','requesón','panela','soya','lenteja'];
  const sinRepetir=cs=>{const v=[];
    for(let i=0;i<cs.length;i++)for(let j=0;j<FAMS.length;j++)
      if(cs[i].toLowerCase().indexOf(FAMS[j])>=0){if(v.indexOf(FAMS[j])>=0)return false;v.push(FAMS[j])}
    return true};
  const EXTRAS={}; porCat('extra_proteina').forEach(a=>EXTRAS[a.nombre]=1);
  const CARBOS={}; porCat('carbohidrato').concat(porCat('des_carbo'))
    .filter(a=>num(a.kcal)>0).forEach(a=>CARBOS[a.nombre]=1);
  const yaTrae=elegidos.some(n=>num((buscar(n)||{}).proteina)>=26);
  const yaCarbo=elegidos.some(traeCarbo);

  const todas=out.map(c=>{
    const cs=c.filter(x=>x&&buscar(x)&&num(buscar(x).kcal)>0);
    const items=cs.map(n=>[n,num(buscar(n).cantidad,1)]);
    const t=totalItems(items);
    return {items,comb:cs,k:t.k,p:t.p,c:t.c,g:t.g};
  }).filter(x=>x.comb.length&&sinRepetir(x.comb)
              &&!(yaTrae &&x.comb.some((n,i)=>i>0&&EXTRAS[n]))
              &&!(yaCarbo&&x.comb.some((n,i)=>i>0&&CARBOS[n])));

  let r=[];
  const tiers=[metaP,metaP-6,metaP-12,metaP-18,0];
  for(let i=0;i<tiers.length;i++){
    r=todas.filter(x=>x.k>=min&&x.k<=max&&x.p>=tiers[i]);
    if(r.length) break;}
  if(!r.length) r=todas.filter(x=>x.k<=max).sort((a,b)=>b.p-a.p).slice(0,8);

  const pos=n=>E.alimentos.findIndex(a=>a.nombre===n);
  r.sort((a,b)=>a.comb.length-b.comb.length||Math.round(a.p/5)-Math.round(b.p/5)||a.k-b.k
    ||a.comb.reduce((s,n)=>s+pos(n),0)-b.comb.reduce((s,n)=>s+pos(n),0));
  const vistos={}, fin=[];
  r.forEach(x=>{const k=x.comb.slice(1).join('|');if(!vistos[k]){vistos[k]=1;fin.push(x)}});
  return fin;
}

  if(items.some(x=>traeCarbo(x[0]))) hay.carb=true;
  return '<div class="regla">'+[['prot','Proteína'],['verd','Verdura'],['carb','Carbohidrato']]

/* ================= EQUIVALENCIAS ================= */
function equivalencias(nombre,cant){
  const a=buscar(nombre); if(!a) return [];
  const objetivo=nutre(nombre,cant).k;
  if(objetivo<=0) return [];
  const mismos=E.alimentos.filter(x=>x.nombre!==a.nombre&&num(x.kcal)>0&&(
    a.categoria==='ingrediente' ? (x.categoria==='ingrediente'&&x.grupo===a.grupo)
                                : x.categoria===a.categoria));
  return mismos.map(x=>{
    const porUni=num(x.kcal)/(num(x.cantidad,1)||1);
    let q=porUni>0? objetivo/porUni : num(x.cantidad,1);
    q = x.unidad==='porción' ? Math.max(.25,Math.round(q*4)/4)
      : (x.unidad==='g'||x.unidad==='ml') ? Math.max(5,Math.round(q/5)*5)
      : Math.max(.5,Math.round(q*2)/2);
    const t=nutre(x.nombre,q);
    return {nombre:x.nombre,cant:q,k:Math.round(t.k),p:Math.round(t.p),
            c:Math.round(t.c),g:Math.round(t.g)};
  }).sort((x,y)=>Math.abs(x.k-objetivo)-Math.abs(y.k-objetivo)).slice(0,14);
}

function punto(){
  const p=document.getElementById('punto');
  p.className='punto '+(!URL_BD?'no':COLA.length?'esp':'ok');

function normReg(r){
  const o={};for(const k in r)o[k]=r[k];
  o.kcal=num(o.kcal); o.proteina=num(o.proteina);
  o.carbos=(o.carbos===''||o.carbos==null)?null:num(o.carbos);
  o.grasas=(o.grasas===''||o.grasas==null)?null:num(o.grasas);
  if(typeof o.items==='string'&&o.items){try{o.items=JSON.parse(o.items)}catch(e){o.items=null}}
  if(!Array.isArray(o.items)) o.items=null;
  return o;
}
function normFav(f){
  const o={};for(const k in f)o[k]=f[k];
  if(typeof o.items==='string'&&o.items){try{o.items=JSON.parse(o.items)}catch(e){o.items=null}}
  if(!Array.isArray(o.items)) o.items=null;
  o.kcal=num(o.kcal);o.proteina=num(o.proteina);o.carbos=num(o.carbos);o.grasas=num(o.grasas);
  return o;
}
async function sincronizar(forzar){
  if(!URL_BD||sincronizando||!navigator.onLine){punto();return}
  sincronizando=true; punto();
  try{
    if(COLA.length){
      const lote=COLA.slice(0,80);
      const res=await fetch(URL_BD,{method:'POST',redirect:'follow',
        headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({ops:lote})});
      const j=await res.json();
      if(j.ok){const ok={};(j.aplicadas||[]).forEach(u=>ok[u]=1);COLA=COLA.filter(o=>!ok[o.uid])}
    }
    if(forzar||!LS.get('ultima',0)||Date.now()-LS.get('ultima',0)>6e5){
      const res=await fetch(URL_BD+'?action=bootstrap',{redirect:'follow'});
      const j=await res.json();
      if(j.ok){
        /* la hoja manda, pero solo si ya trae el catálogo con macros */
        if(j.alimentos&&j.alimentos.length&&j.alimentos[0].carbos!==undefined) E.alimentos=j.alimentos;
        if(j.perfil&&Object.keys(j.perfil).length) E.perfil={...META_DEF,...j.perfil};
        if(j.peso&&j.peso.length) E.peso=j.peso;
        const pend={}; COLA.forEach(o=>pend[o.uid]=1);
        /* mezcla por uid: una respuesta vacía nunca borra lo del teléfono */
        const mezclar=(local,serv,norm)=>{
          const m=new Map();
          (local||[]).forEach(r=>m.set(r.uid,r));
          (serv||[]).forEach(r=>m.set(r.uid,norm(r)));
          (local||[]).filter(r=>pend[r.uid]).forEach(r=>m.set(r.uid,r));
          return Array.from(m.values());};
        E.registro=mezclar(E.registro,j.registro,normReg).filter(r=>r.estado!=='borrado');
        E.favoritos=mezclar(E.favoritos,j.favoritos,normFav);
        LS.set('ultima',Date.now());
      }
    }
    guardar(); pintar();
  }catch(e){ /* sin red: se queda en la cola */ }
  sincronizando=false; punto();
}

function instruccion(t,M,futuro){
  if(futuro){
    if(!t.n) return 'Día sin planear. Empieza por la comida: es la que más cambia el resto.';
    if(t.pp<M.prot*.85) return 'Planeado: te faltarían <b>'+Math.round(M.prot-t.pp)+' g</b> de proteína.';
    if(t.kp>M.kcal*1.06) return 'Planeado: vas arriba de calorías. Quita un carbohidrato.';
    return 'Día planeado y bien armado.';
  }
  if(!t.n) return 'Nada registrado todavía.';
  if(t.pend) return t.pend===1? 'Falta <b>1</b> por confirmar. Toca el círculo cuando te lo comas.'
                              : 'Faltan <b>'+t.pend+'</b> por confirmar. Toca el círculo cuando te las comas.';
  const falta=Math.round(M.prot-t.pc);
  if(falta>12) return 'Te faltan <b>'+falta+' g</b> de proteína. Una lata de atún son 24 g.';
  if(t.kc>M.kcal*1.06) return 'Te pasaste de calorías. Cuenta el promedio de la semana, no el día.';
  if(t.sinMacro) return '<b>Buen día.</b> ('+t.sinMacro+' registro'+(t.sinMacro>1?'s':'')+' sin desglose de macros.)';
  return '<b>Buen día.</b> Proteína cubierta sin pasarte.';
}

/* ================= VISTA: SÚPER ================= */
function ingredientesDe(r){
  const out=[];
  const lista = r.items ? r.items.map(x=>x[0]) : String(r.descripcion||'').split(' · ').map(s=>s.trim());
  lista.forEach(n=>{
    const a=buscar(n); if(!a||!a.ingredientes)return;
    String(a.ingredientes).split(',').forEach(g=>{g=g.trim().toLowerCase(); if(g)out.push(g)});});
  return out;
}
function planeados(){
  const c={};
  for(let i=0;i<7;i++) delDia(suma(hoy,i)).forEach(r=>
    ingredientesDe(r).forEach(g=>c[g]=(c[g]||0)+1));
  return Object.keys(c).map(k=>[k,c[k]]).sort((a,b)=>b[1]-a[1]);
}
function despensa(){
  const c={};
  E.alimentos.forEach(a=>{ if(!a.ingredientes||num(a.kcal)<=0||a.categoria==='ingrediente')return;
    String(a.ingredientes).split(',').forEach(g=>{g=g.trim().toLowerCase(); if(g)c[g]=(c[g]||0)+1});});
  return Object.keys(c).map(k=>[k,c[k]]).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
}
const filaIng=(g,txt)=>'<button class="ing '+(TENGO[g]?'ok':'')+'" data-ing="'+esc(g)+'">'
  +'<span class="caja">'+ICO_CHECK+'</span><span class="nm">'+may(g)+'</span>'
  +'<span class="ct">'+txt+'</span></button>';

function pintarSuper(){
  const cont=document.getElementById('super');
  let c='<div class="seg">'+[['comprar','Comprar'],['despensa','Despensa']]
    .map(x=>'<button data-panel="'+x[0]+'" aria-selected="'+(panelSuper===x[0])+'">'+x[1]+'</button>')
    .join('')+'</div>';
  if(panelSuper==='comprar'){
    const L=planeados();
    if(!L.length){
      cont.innerHTML=c+'<div class="vacio"><b>Nada que comprar todavía</b>'
        +'Planea algunos días en Semana y aquí aparece lo que vas a necesitar.</div>';
      return;}
    const faltan=L.filter(x=>!TENGO[x[0]]).length;
    c+='<p class="rotulo">'+(faltan?'Te faltan '+faltan+' de '+L.length:'Ya tienes todo')+'</p>'
      +'<div class="lista">'+L.map(x=>filaIng(x[0],x[1]+'×')).join('')+'</div>'
      +'<p class="instruccion" style="margin-top:var(--e3)">Sale de lo que tienes planeado en los próximos 7 días. '
      +'Lo que cocina tu mamá no aparece, porque esa despensa no la compras tú.</p>';
  } else {
    const L=despensa(), tengo=L.filter(x=>TENGO[x[0]]).length;
    c+='<p class="rotulo">Tienes '+tengo+' de '+L.length+'</p>'
      +'<div class="lista">'+L.map(x=>filaIng(x[0],x[1]+' platillo'+(x[1]>1?'s':''))).join('')+'</div>'
      +'<p class="instruccion" style="margin-top:var(--e3)">Todos los ingredientes del catálogo, '
      +'ordenados por cuántos platillos te abren. Marca lo que ya tengas en casa y desaparece de Comprar.</p>';
  }
  cont.innerHTML=c+'<button class="btn texto" id="limpiar" style="margin-top:var(--e2)">Desmarcar todo</button>';

const hoja=document.getElementById('hoja');
let H={modo:null};

function abrirHoja(){hoja.classList.add('on');document.body.style.overflow='hidden'}
function cerrarHoja(){hoja.classList.remove('on');document.body.style.overflow='';
  document.getElementById('h-cuerpo').scrollTop=0}
hoja.querySelector('.velo').onclick=cerrarHoja;

function cabecera(o){
  let c='<div class="h-nav">';
  c+= o.atras? '<button class="h-atras" data-atras="1"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>'+o.atras+'</button>'
             : '<span></span>';

    c+='<div class="pasos">'+Array.from({length:o.total},(_,i)=>
      '<i class="'+(i<o.paso?'on':'')+'"></i>').join('')+'</div>';
    c+='<p class="h-paso">Paso '+o.paso+' de '+o.total+'</p>';}
  c+='<h2>'+o.titulo+'</h2>';
  if(o.texto) c+='<p>'+o.texto+'</p>';

}
function pie(html){const p=document.getElementById('h-pie'); p.hidden=!html; p.innerHTML=html||''}

function pintarHoja(){
  if(H.modo==='agregar')     return H.paso===1?pasoElegir():H.paso===2?pasoPlato():pasoManual();
  if(H.modo==='constructor') return pantallaConstructor();
  if(H.modo==='sustituir')   return pantallaSustituir();
  if(H.modo==='detalle')     return pantallaDetalle();
  if(H.modo==='editar')      return pantallaEditar();
  if(H.modo==='ajustes')     return pantallaAjustes();
}

/* ---------- agregar: paso 1 ---------- */

function aplicarMult(m){
  const prev=H.mult||1;
  H.items=H.items.map(x=>[x[0],Math.round(x[1]/prev*m*1000)/1000]);

}

function pantallaConstructor(){

  if(H.arm.length){

      const a=buscar(x[0])||{}, nu=nutre(x[0],x[1]);
      return '<li><button class="nm" data-sust-arm="'+i+'"><b>'+may(x[0])+'</b>'

        +(Math.round(num(x[1])*10)/10)+'" aria-label="Cantidad"><em>'+esc(a.unidad||'')+'</em></span>'
        +'<button class="quitar" data-quitar-arm="'+i+'" aria-label="Quitar">'+ICO_X+'</button></li>';
    }).join('')+'</ul>'
    +'<div class="falta"><b class="num'+(falta<-H.objetivo*0.06?' alto':'')+'">'+t.k+' kcal</b>'
    +'<span>'+(falta>0?'te faltan '+Math.round(falta):'te pasaste por '+Math.round(-falta))+' kcal</span></div>'

    if(falta>60){
      const sug=sugerencias(falta,t,M);
      if(sug.length) c+='<p class="rotulo sep">Para cerrar la brecha</p><div class="lista">'+sug.map(s=>
        '<button class="op caja-f" data-sug="'+esc(s.nombre)+'" data-cant="'+s.cant+'">'

        +'<span class="kc"><b class="num">'+s.k+'</b><span class="num">'+s.p+' g</span></span></button>').join('')+'</div>';
    }
  } else {
    c+='<div class="vacio"><b>Todavía no hay nada</b>Busca abajo y toca para agregar. '
      +'Los totales se actualizan solos.</div>';
  }
  c+='<p class="rotulo sep">Agregar ingrediente</p>'
    +'<div class="buscar">'+ICO_LUPA+'<input id="c-q" placeholder="pollo, arroz, aceite…" value="'+esc(H.q)
    +'" autocomplete="off" autocorrect="off"></div>';
  const q=H.q.trim().toLowerCase();
  let L=E.alimentos.filter(a=>a.categoria==='ingrediente');
  L = q ? L.filter(a=>String(a.nombre).toLowerCase().indexOf(q)>=0) : L.slice(0,10);
  c+= L.length? '<div class="lista">'+L.slice(0,40).map(a=>
      '<button class="op caja-f" data-ing-add="'+esc(a.nombre)+'">'
      +'<span class="nm"><b>'+may(a.nombre)+'</b><span>por '+esc(a.porcion)+' · P '+Math.round(num(a.proteina))
      +' · C '+Math.round(num(a.carbos))+' · G '+Math.round(num(a.grasas))+'</span></span>'
      +'<span class="kc"><b class="num">'+Math.round(num(a.kcal))+'</b><span>kcal</span></span></button>').join('')+'</div>'
    : '<div class="vacio">Nada con ese nombre.</div>';
  c+='<p class="instruccion" style="margin-top:var(--e3)">Los valores son estimaciones de tablas estándar. '
    +'Si conoces el dato exacto de un producto, edítalo en la hoja de cálculo.</p>';
  document.getElementById('h-cuerpo').innerHTML=c;
  pie(H.arm.length
    ? '<button class="btn" data-guardar-arm="1">Ponerlo en mi día</button>'
      +'<button class="btn texto" data-fav-arm="1">Guardarlo como favorito y ponerlo</button>'
    : '');
}
function sugerencias(falta,t,M){
  const T=H.T, metaP=M.prot*(T.fp||0.3), faltaP=metaP-t.p;
  const cand=E.alimentos.filter(a=>a.categoria==='ingrediente'&&num(a.kcal)>0);
  return cand.map(a=>{
    const porUni=num(a.kcal)/(num(a.cantidad,1)||1);
    let q=porUni>0?falta/porUni:0;
    q = (a.unidad==='g'||a.unidad==='ml') ? Math.round(q/5)*5 : Math.round(q*2)/2;
    if(q<=0) return null;
    const nu=nutre(a.nombre,q);
    const razon = (faltaP>8&&a.grupo==='proteina') ? 'sube la proteína'
                : a.grupo==='verdura' ? 'volumen con pocas calorías'
                : (a.grupo==='cereal'||a.grupo==='leguminosa') ? 'completa el carbohidrato'
                : a.grupo==='grasa' ? 'cierra con grasa buena' : 'ajusta las calorías';
    const score=(faltaP>8? -nu.p:0)+Math.abs(nu.k-falta)/50;
    return {nombre:a.nombre,cant:q,k:Math.round(nu.k),p:Math.round(nu.p),razon,score};
  }).filter(Boolean).sort((a,b)=>a.score-b.score).slice(0,5);
}

/* ================= EVENTOS DE LA HOJA ================= */
hoja.addEventListener('click',function(e){
  const g=s=>e.target.closest(s); let b;

  if(g('[data-cerrar]')) return cerrarHoja();
  if(g('[data-atras]')){
    if(H.modo==='agregar'&&H.paso===2){H.paso=1;H.items=null;H.idxUsado=-1;return pintarHoja()}
    if(H.modo==='agregar'&&H.paso===3){H.paso=1;return pintarHoja()}
    if(H.modo==='sustituir'){H=H.volver;return pintarHoja()}
    if(H.modo==='ajustes'){H.sub='menu';return pintarHoja()}
    return cerrarHoja();}

  /* paso 1 */
  if(b=g('[data-sel]')){
    const n=b.getAttribute('data-sel'), a=buscar(n);
    if(!a) return;
    if(H.T.solo){
      agregar(dia,H.T.id,[[a.nombre,num(a.cantidad,1)]]);
      guardar();cerrarHoja();pintar();aviso(may(a.nombre)+' · '+Math.round(num(a.kcal))+' kcal');return}
    const i=H.sel.indexOf(n);
    if(i>=0) H.sel.splice(i,1); else H.sel.push(n);
    H.idx=0; H.items=null; H.idxUsado=-1; return pasoElegir();}
  if(b=g('[data-fav]')){
    const f=E.favoritos.find(x=>x.uid===b.getAttribute('data-fav')); if(!f) return;
    f.veces=num(f.veces)+1; encolar(opFavorito(f));
    if(f.items&&f.items.length) agregar(dia,f.tiempo,f.items);
    else agregarSuelto(dia,f.tiempo,f.detalle,f.kcal,f.proteina,num(f.carbos),num(f.grasas));
    guardar();cerrarHoja();pintar();aviso('Agregado · '+Math.round(num(f.kcal))+' kcal');return}
  if(g('[data-ver-plato]')){H.paso=2;H.idx=0;H.items=null;H.idxUsado=-1;return pintarHoja()}
  if(b=g('[data-ver]')) return abrirDetalle(b.getAttribute('data-ver'));
  if(g('[data-manual]')){H.paso=3;return pintarHoja()}
  if(g('[data-constructor]')) return abrirConstructor(H.T.id);

  /* paso 2 */
  if(g('[data-otra]')){H.idx++;H.items=null;return pasoPlato()}
  if(b=g('[data-mult]')){aplicarMult(num(b.getAttribute('data-mult'),1));return pasoPlato()}
  if(b=g('[data-sust]')) return abrirSustituir('plato',+b.getAttribute('data-sust'));
  if(g('[data-poner]')){
    const t=totalItems(H.items);
    agregar(dia,H.T.id,H.items);
    guardar();cerrarHoja();pintar();aviso('Agregado · '+t.k+' kcal, '+t.p+' g');return}
  if(g('[data-guardar]')){
    const t=totalItems(H.items);
    const f={uid:uid(),tiempo:H.T.id,nombre:H.items[0][0],detalle:describe(H.items),
             kcal:t.k,proteina:t.p,carbos:t.c,grasas:t.g,items:H.items.map(x=>[x[0],x[1]]),veces:1};
    E.favoritos.push(f); encolar(opFavorito(f));
    agregar(dia,H.T.id,H.items);
    guardar();cerrarHoja();pintar();aviso('Guardado en favoritos');return}

  /* sustituir */
  if(b=g('[data-eq]')){
    const nuevo=b.getAttribute('data-eq'), q=num(b.getAttribute('data-cant'),1), v=H.volver, i=H.idx;
    if(H.origen==='plato'){ v.items[i]=[nuevo,q]; v.mult=1; }
    else if(H.origen==='arm'){ v.arm[i]=[nuevo,q]; }
    else { const r=E.registro.find(x=>x.uid===v.uid);
      if(r&&r.items){const items=r.items.map(x=>[x[0],x[1]]); items[i]=[nuevo,q];
        cambiar(v.uid,{items}); guardar(); pintar();} }
    H=v; aviso('Cambiado por '+may(nuevo)); return pintarHoja();}
  if(g('[data-quitar-parte]')){
    const v=H.volver, i=H.idx;
    if(H.origen==='plato'){ if(v.items.length<=1) return aviso('Debe quedar al menos uno');
      v.items.splice(i,1); v.mult=1; }
    else if(H.origen==='arm'){ v.arm.splice(i,1); }
    else { const r=E.registro.find(x=>x.uid===v.uid);
      if(!r||!r.items||r.items.length<=1) return aviso('Debe quedar al menos uno');
      cambiar(v.uid,{items:r.items.filter((_,j)=>j!==i)}); guardar(); pintar(); }
    H=v; aviso('Quitado'); return pintarHoja();}

  /* constructor */
  if(b=g('[data-ing-add]')){
    const a=buscar(b.getAttribute('data-ing-add')); if(!a) return;
    const ya=H.arm.findIndex(x=>x[0]===a.nombre);
    if(ya>=0) H.arm[ya][1]=num(H.arm[ya][1])+num(a.cantidad,1);
    else H.arm.push([a.nombre,num(a.cantidad,1)]);
    aviso(may(a.nombre)+' agregado'); return pantallaConstructor();}
  if(b=g('[data-quitar-arm]')){H.arm.splice(+b.getAttribute('data-quitar-arm'),1);return pantallaConstructor()}
  if(b=g('[data-sust-arm]')) return abrirSustituir('arm',+b.getAttribute('data-sust-arm'));
  if(b=g('[data-sug]')){
    const n=b.getAttribute('data-sug'), q=num(b.getAttribute('data-cant'),1);
    const ya=H.arm.findIndex(x=>x[0]===n);
    if(ya>=0) H.arm[ya][1]=num(H.arm[ya][1])+q; else H.arm.push([n,q]);
    aviso(may(n)+' agregado'); return pantallaConstructor();}
  if(g('[data-guardar-arm]')||g('[data-fav-arm]')){
    if(!H.arm.length) return aviso('Agrega al menos un ingrediente');
    const limpio=H.arm.filter(x=>num(x[1])>0);
    if(!limpio.length) return aviso('Pon una cantidad mayor que cero');
    const t=totalItems(limpio);
    if(g('[data-fav-arm]')){
      const f={uid:uid(),tiempo:H.T.id,nombre:limpio[0][0],detalle:describe(limpio),
               kcal:t.k,proteina:t.p,carbos:t.c,grasas:t.g,items:limpio.map(x=>[x[0],x[1]]),veces:1};
      E.favoritos.push(f); encolar(opFavorito(f));}
    agregar(dia,H.T.id,limpio.map(x=>[x[0],x[1]]));
    guardar();cerrarHoja();pintar();aviso('Agregado · '+t.k+' kcal, '+t.p+' g');return}

  /* detalle */
  if(b=g('[data-al-constructor]')){
    const a=buscar(b.getAttribute('data-al-constructor')); if(!a) return;
    return abrirConstructor('comida',[[a.nombre,num(a.cantidad,1)]]);}

  /* manual */
  if(g('[data-manual-ok]')){
    const n=document.getElementById('m-n').value.trim();
    if(!n){aviso('Ponle un nombre');document.getElementById('m-n').focus();return}
    const k=limpiaCant(document.getElementById('m-k').value);
    agregarSuelto(dia,H.T.id,n,k,limpiaCant(document.getElementById('m-p').value),
      limpiaCant(document.getElementById('m-c').value),limpiaCant(document.getElementById('m-g').value));
    guardar();cerrarHoja();pintar();aviso('Agregado · '+Math.round(k)+' kcal');return}

  /* editar */
  if(b=g('[data-sust-reg]')) return abrirSustituir('reg',+b.getAttribute('data-sust-reg'));
  if(g('[data-editar-ok]')){
    const v=id=>document.getElementById(id).value;
    const nom=v('e-n').trim();
    if(!nom){aviso('Ponle un nombre');return}
    const cv=v('e-c').trim(), gv=v('e-g').trim();
    cambiar(H.uid,{descripcion:nom,kcal:limpiaCant(v('e-k')),proteina:limpiaCant(v('e-p')),
      carbos:cv===''?null:limpiaCant(cv), grasas:gv===''?null:limpiaCant(gv),
      tiempo:v('e-t'),estado:v('e-s')});
    guardar();cerrarHoja();pintar();aviso('Listo');return}
  if(g('[data-quitar]')){
    cambiar(H.uid,{estado:'borrado'});
    E.registro=E.registro.filter(r=>r.uid!==H.uid);
    guardar();cerrarHoja();pintar();aviso('Quitado del día');return}

  /* ajustes */
  if(b=g('[data-sub]')){H.sub=b.getAttribute('data-sub');return pintarHoja()}
  if(g('[data-datos-ok]')){
    const v=id=>document.getElementById(id).value;
    const peso=limpiaCant(v('a-peso'))||num(E.perfil.peso,84);
    const c={peso,
      peso_meta:limpiaCant(v('a-meta'))||75,
      edad:Math.min(100,Math.max(14,limpiaCant(v('a-edad'))||27)),
      estatura:Math.min(230,Math.max(120,limpiaCant(v('a-est'))||178)),
      actividad:num(v('a-act'),1.3), ritmo:num(v('a-rit'),550),
      prot_por_kg:Math.min(3,Math.max(.8,num(v('a-ppk'),1.8))),
      pct_grasa:Math.min(50,Math.max(15,num(v('a-pg'),30)))};
    Object.assign(E.perfil,c);
    Object.keys(c).forEach(k=>encolar({tipo:'perfil',uid:'perfil-'+k,clave:k,valor:c[k]}));
    encolar({tipo:'peso',uid:'peso-'+hoy,fecha:hoy,kg:peso,nota:''});
    guardar();H.sub='menu';pintarHoja();pintar();aviso('Meta actualizada: '+mil(metas().kcal)+' kcal');return}
  if(g('[data-url-ok]')){
    const u=document.getElementById('a-url').value.trim();
    if(u&&!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) return aviso('El enlace debe terminar en /exec');
    URL_BD=u; LS.set('url',URL_BD);
    punto(); sincronizar(true); H.sub='menu'; pintarHoja(); aviso('Enlace guardado');return}
  if(g('#a-sync')){sincronizar(true);aviso('Sincronizando…');return}
  if(g('#a-probar')){
    const u=document.getElementById('a-url').value.trim(), btn=document.getElementById('a-probar');
    if(!/\/exec$/.test(u)){btn.textContent='El enlace debe terminar en /exec';return}
    btn.textContent='Probando…';
    fetch(u+'?action=ping',{redirect:'follow'}).then(r=>r.json())
      .then(j=>btn.textContent=j.ok?'Funciona':'Respondió raro')
      .catch(()=>{btn.textContent='No conectó'});
    return}
});

/* entradas de texto dentro de la hoja */
hoja.addEventListener('input',function(e){
  const t=e.target;
  if(t.id==='c-q'){
    H.q=t.value; const pos=t.selectionStart;
    pantallaConstructor();
    const n=document.getElementById('c-q');
    if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}
    return}
  if(t.id==='c-obj'){
    H.objetivo=Math.round(limpiaCant(t.value));
    refrescarTotalesArmado(); return}
  if(t.getAttribute&&t.getAttribute('data-cant')!==null&&H.modo==='constructor'){
    const i=+t.getAttribute('data-cant'); if(!H.arm[i])return;
    H.arm[i][1]=limpiaCant(t.value);
    const nu=nutre(H.arm[i][0],H.arm[i][1]);
    const fila=t.closest('li'), det=fila&&fila.querySelector('.nm span');
    if(det) det.textContent=Math.round(nu.k)+' kcal · P '+Math.round(nu.p)
      +' · C '+Math.round(nu.c)+' · G '+Math.round(nu.g);
    refrescarTotalesArmado(); return}
});
function refrescarTotalesArmado(){
  if(H.modo!=='constructor') return;
  const t=totalItems(H.arm), falta=H.objetivo-t.k;
  const ob=document.querySelector('.objetivo .ob-t b'); if(ob)ob.textContent=mil(H.objetivo)+' kcal';
  const fb=document.querySelector('.falta b'), fs=document.querySelector('.falta span');
  if(fb){fb.textContent=t.k+' kcal'; fb.classList.toggle('alto',falta<-H.objetivo*0.06)}
  if(fs)fs.textContent=falta>0?'te faltan '+Math.round(falta)+' kcal'
                              :'te pasaste por '+Math.round(-falta)+' kcal';
  const d=document.querySelectorAll('.desglose b');
  if(d.length>=3){d[0].textContent=t.p+' g'; d[1].textContent=t.c+' g'; d[2].textContent=t.g+' g'}
  guardar();
}
/* al salir del campo, repinta para refrescar las sugerencias */
hoja.addEventListener('change',function(e){
  if(e.target.getAttribute&&e.target.getAttribute('data-cant')!==null&&H.modo==='constructor')
    pantallaConstructor();
});

/* ================= EVENTOS DE LAS VISTAS ================= */
document.getElementById('comidas').addEventListener('click',function(e){
  let b;
  if(b=e.target.closest('[data-tick]')){
    const r=E.registro.find(x=>x.uid===b.getAttribute('data-tick')); if(!r)return;
    const nuevo=r.estado==='comido'?'planeado':'comido';
    cambiar(r.uid,{estado:nuevo}); guardar(); pintar();
    aviso(nuevo==='comido'?'Confirmado':'Marcado como planeado'); return}
  if(b=e.target.closest('[data-edit]')) return abrirEditar(b.getAttribute('data-edit'));
  if(b=e.target.closest('[data-add]'))  return abrirAgregar(b.getAttribute('data-add'));
});
document.getElementById('semana').addEventListener('click',function(e){
  const b=e.target.closest('[data-dia]'); if(!b)return;
  dia=b.getAttribute('data-dia'); irA('dia');
});
document.getElementById('alimentos').addEventListener('click',function(e){
  let b;
  if(b=e.target.closest('[data-grupo]')){filtroAl=b.getAttribute('data-grupo');
    LS.set('filtro',filtroAl);return pintarAlimentos()}
  if(e.target.closest('#ir-constructor')) return abrirConstructor('comida');
  if(b=e.target.closest('[data-ver]')) return abrirDetalle(b.getAttribute('data-ver'));
});
document.getElementById('alimentos').addEventListener('input',function(e){
  if(e.target.id!=='q-al')return;
  textoAl=e.target.value; const pos=e.target.selectionStart;
  pintarAlimentos();
  const n=document.getElementById('q-al');
  if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}
});
document.getElementById('super').addEventListener('click',function(e){
  let b;
  if(b=e.target.closest('[data-panel]')){
    panelSuper=b.getAttribute('data-panel'); LS.set('panel',panelSuper); return pintarSuper()}
  if(b=e.target.closest('[data-ing]')){
    const g=b.getAttribute('data-ing'); TENGO[g]=!TENGO[g]; LS.set('marcados',TENGO); return pintarSuper()}
  if(e.target.closest('#limpiar')){TENGO={};LS.set('marcados',TENGO);pintarSuper();aviso('Lista limpia')}
});

document.getElementById('ant').onclick=function(){dia=suma(dia,-1);pintar()};
document.getElementById('sig').onclick=function(){dia=suma(dia,1);pintar()};
document.getElementById('fecha').onclick=function(){dia=hoy;pintar()};
document.getElementById('b-ajustes').onclick=abrirAjustes;
Array.prototype.forEach.call(document.querySelectorAll('nav button'),
  b=>b.onclick=function(){irA(b.getAttribute('data-v'))});

const TIT={alimentos:'Alimentos',super:'Súper'};
function irA(v){
  vista=v;
  Array.prototype.forEach.call(document.querySelectorAll('nav button'),
    x=>x.setAttribute('aria-selected',x.getAttribute('data-v')===v));
  Array.prototype.forEach.call(document.querySelectorAll('.vista'),
    s=>s.classList.toggle('on',s.id==='v-'+v));
  const conFecha=(v==='dia'||v==='semana');
  document.getElementById('cabeza-dia').hidden=!conFecha;
  document.getElementById('ant').hidden=!conFecha;
  document.getElementById('sig').hidden=!conFecha;
  document.getElementById('fecha').hidden=!conFecha;
  const ts=document.getElementById('titulo-seccion');
  ts.hidden=conFecha; ts.textContent=TIT[v]||'';
  pintar(); window.scrollTo({top:0});
}

/* ================= ARRANQUE ================= */
function pintar(){
  pintarMarcador();
  if(vista==='dia') pintarDia();
  else if(vista==='semana') pintarSemana();
  else if(vista==='alimentos') pintarAlimentos();
  else if(vista==='super') pintarSuper();
  punto();
}
guardar();
pintar();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
sincronizar(true);
setInterval(function(){const h=fechaHoy(); if(h!==hoy){hoy=h;dia=h;pintar()}},60000);
</script>
