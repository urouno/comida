<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Mi día</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi día">
<meta name="theme-color" content="#173A6B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--tinta:#173A6B;--azul:#2F6FB0;--cal:#FBF6EC;--bl:#fff;--barro:#BF4B2A;--maiz:#DFA020;
--nopal:#3C7A55;--humo:#6A7180;--linea:#E4DED2;
--d:'Archivo',sans-serif;--t:'IBM Plex Sans',system-ui,sans-serif;--m:'IBM Plex Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--t);background:var(--cal);color:var(--tinta);min-height:100vh;display:flex;
justify-content:center;overscroll-behavior-y:none;
background-image:radial-gradient(circle at 12px 12px,rgba(23,58,107,.04) 1.5px,transparent 1.6px),
radial-gradient(circle at 36px 36px,rgba(23,58,107,.04) 1.5px,transparent 1.6px);background-size:48px 48px}
.tel{width:100%;max-width:430px;background:var(--cal);min-height:100vh;display:flex;flex-direction:column;
box-shadow:0 0 0 1px var(--linea)}

/* ---------- cabecera ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--tinta);color:#fff;overflow:hidden;
padding:max(10px,env(safe-area-inset-top)) 14px 11px}
.top .tile{position:absolute;inset:0;width:100%;height:100%;opacity:.38}
.fila1{position:relative;display:flex;align-items:center;gap:9px;margin-bottom:9px}
.nav-d{display:flex;align-items:center;gap:2px;flex:1;min-width:0}
.nav-d button{background:rgba(255,255,255,.12);border:0;color:#fff;width:28px;height:28px;border-radius:8px;
display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.nav-d button svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.6}
.nav-d .fecha{flex:1;text-align:center;font-family:var(--d);font-size:14px;font-weight:700;
text-transform:capitalize;line-height:1.15;cursor:pointer;padding:2px}
.nav-d .fecha small{display:block;font-family:var(--t);font-size:10px;font-weight:500;color:#9EC2E8;
text-transform:none;margin-top:1px}
.sync{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;
align-items:center;justify-content:center;flex:none;border:0;cursor:pointer;position:relative}
.sync svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2}
.sync .pt{position:absolute;top:-1px;right:-1px;width:9px;height:9px;border-radius:50%;
border:2px solid var(--tinta)}
.pt.ok{background:#6FCF97}.pt.esp{background:var(--maiz)}.pt.no{background:#8A96A8}

.panel{position:relative;display:flex;align-items:center;gap:12px}
.ring{position:relative;width:58px;height:58px;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring .n{font-family:var(--m);font-size:16px;font-weight:600;letter-spacing:-.04em}
.ring .u{font-size:7px;color:#9EC2E8;margin-top:2px;letter-spacing:.07em}
.med{flex:1;min-width:0}
.med .l{display:flex;justify-content:space-between;font-size:10px;color:#B9D2EC;margin-bottom:3px}
.med .l b{font-family:var(--m);color:#fff;font-weight:600;font-size:11px}
.bar{height:5px;background:rgba(255,255,255,.16);border-radius:3px;overflow:hidden;margin-bottom:8px;position:relative}
.bar i{display:block;height:100%;border-radius:3px;transition:width .4s}
.bar i.com{background:var(--maiz)}
.bar i.pla{background:rgba(255,255,255,.3);position:absolute;top:0;left:0}
.bar i.com{position:relative;z-index:1}
.bar i.pas{background:var(--barro)}
.frase{font-size:11px;color:#C3D8EE;line-height:1.35;margin-top:2px}

/* ---------- cuerpo ---------- */
main{flex:1;padding:12px 13px calc(84px + env(safe-area-inset-bottom))}
.vista{display:none}.vista.on{display:block}
h2.sec{font-family:var(--d);font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
color:var(--humo);margin:16px 0 7px;display:flex;align-items:center;gap:7px}
h2.sec::after{content:'';flex:1;height:1px;background:var(--linea)}
h2.sec:first-child{margin-top:0}

/* ---------- tiempo de comida ---------- */
.tiempo{background:var(--bl);border:1px solid var(--linea);border-radius:14px;margin-bottom:9px;overflow:hidden}
.t-cab{display:flex;align-items:center;gap:10px;padding:11px 12px}
.t-ico{width:30px;height:30px;border-radius:9px;background:#F1EBE0;display:flex;align-items:center;
justify-content:center;flex:none}
.t-ico svg{width:17px;height:17px;stroke:var(--tinta);fill:none;stroke-width:1.6}
.tiempo.full .t-ico{background:var(--tinta)}.tiempo.full .t-ico svg{stroke:#fff}
.t-tit{flex:1;min-width:0}
.t-tit b{font-family:var(--d);font-size:13.5px;font-weight:700;display:block}
.t-tit span{font-size:10.5px;color:var(--humo);display:block;margin-top:1px}
.t-num{font-family:var(--m);font-size:11px;color:var(--humo);text-align:right;flex:none;line-height:1.4}
.t-num em{font-style:normal;color:var(--azul);font-weight:600}
.items{border-top:1px solid var(--linea)}
.it{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid #F3EFE6}
.it:last-child{border-bottom:0}
.tick{width:23px;height:23px;border-radius:50%;border:1.6px solid var(--linea);flex:none;background:var(--bl);
display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.tick svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:3}
.it.comido .tick{background:var(--nopal);border-color:var(--nopal)}
.it-t{flex:1;min-width:0;cursor:pointer}
.it-t b{font-size:12.5px;font-weight:500;line-height:1.3;display:block}
.it.comido .it-t b{color:var(--humo)}
.it-t span{font-family:var(--m);font-size:10px;color:var(--humo);display:block;margin-top:2px}
.it-t span em{font-style:normal;color:var(--azul)}
.eti{display:inline-block;font-family:var(--d);font-size:8px;font-weight:700;letter-spacing:.08em;
text-transform:uppercase;padding:1px 5px;border-radius:4px;background:#EDE6D9;color:var(--humo);margin-left:5px;
vertical-align:middle}
.add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border:0;
border-top:1px dashed var(--linea);background:none;font-family:var(--t);font-size:12px;font-weight:600;
color:var(--azul);cursor:pointer}
.add svg{width:13px;height:13px;stroke:var(--azul);fill:none;stroke-width:2.4}

/* ---------- semana ---------- */
.dia{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--bl);
border:1px solid var(--linea);border-radius:13px;margin-bottom:7px;cursor:pointer;width:100%;text-align:left;
font-family:var(--t);color:var(--tinta)}
.dia.hoy{border-color:var(--tinta);border-width:1.6px}
.dia .dd{flex:none;width:40px;text-align:center}
.dia .dd b{font-family:var(--d);font-size:17px;font-weight:800;display:block;line-height:1}
.dia .dd span{font-size:9px;color:var(--humo);text-transform:uppercase;letter-spacing:.06em}
.dia .info{flex:1;min-width:0}
.dia .info .bb{height:5px;background:#EDE6D9;border-radius:3px;overflow:hidden;margin-bottom:4px}
.dia .info .bb i{display:block;height:100%;background:var(--azul);border-radius:3px}
.dia .info small{font-size:10.5px;color:var(--humo);line-height:1.3;display:block}
.dia .mm{font-family:var(--m);font-size:10.5px;text-align:right;flex:none;line-height:1.4;color:var(--humo)}
.dia .mm em{font-style:normal;color:var(--azul);font-weight:600}

/* ---------- súper ---------- */
.ing{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bl);
border-bottom:1px solid var(--linea);cursor:pointer}
.ing:first-child{border-radius:13px 13px 0 0}.ing:last-child{border-bottom:0;border-radius:0 0 13px 13px}
.ing .bx{width:20px;height:20px;border-radius:6px;border:1.6px solid var(--linea);flex:none;
display:flex;align-items:center;justify-content:center}
.ing .bx svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:3}
.ing.ok .bx{background:var(--nopal);border-color:var(--nopal)}
.ing.ok .nm{text-decoration:line-through;color:var(--humo)}
.ing .nm{flex:1;font-size:13px;text-transform:capitalize}
.ing .ct{font-family:var(--m);font-size:10.5px;color:var(--humo);flex:none}
.listaing{border:1px solid var(--linea);border-radius:13px;overflow:hidden}

/* ---------- genéricos ---------- */
.vacio{text-align:center;padding:28px 20px;color:var(--humo);font-size:12.5px;line-height:1.55}
.vacio b{display:block;font-family:var(--d);font-size:14px;color:var(--tinta);margin-bottom:4px}
.btn{width:100%;padding:12px;border:0;border-radius:11px;font-family:var(--d);font-size:13px;
font-weight:700;cursor:pointer;background:var(--tinta);color:#fff}
.btn.sec{background:#E8EEF5;color:var(--tinta)}
.btn.lin{background:none;border:1.5px solid var(--linea);color:var(--tinta)}
.btn.peli{background:none;color:var(--barro);border:1.5px solid #EBC9BE}
.btn+.btn{margin-top:7px}
.row2{display:flex;gap:7px}.row2 .btn{margin-top:0}
.nota{font-size:11.5px;color:var(--humo);line-height:1.5}

/* ---------- hoja inferior ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.on{display:block}
.sheet .fondo{position:absolute;inset:0;background:rgba(23,58,107,.42)}
.sheet .panel2{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
max-height:88vh;background:var(--cal);border-radius:20px 20px 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch;
padding:7px 14px calc(20px + env(safe-area-inset-bottom))}
.asa{width:36px;height:4px;background:var(--linea);border-radius:2px;margin:6px auto 12px}
.sheet h3{font-family:var(--d);font-size:16px;font-weight:800;margin-bottom:3px}
.sheet .sub{font-size:11.5px;color:var(--humo);line-height:1.5;margin-bottom:12px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:#EDE6D9;padding:3px;
border-radius:11px;margin-bottom:12px}
.tabs button{font-family:var(--d);font-size:11.5px;font-weight:700;padding:8px 2px;border:0;border-radius:8px;
background:none;color:var(--humo);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--tinta);color:#fff}
.op{display:flex;align-items:center;gap:9px;padding:10px 11px;border:1.5px solid var(--linea);
border-radius:11px;background:var(--bl);cursor:pointer;text-align:left;font-family:var(--t);font-size:12.5px;
color:var(--tinta);width:100%;margin-bottom:6px}
.op[aria-pressed=true]{border-color:var(--tinta);background:#F5F8FC}
.op .sm{width:8px;height:8px;border-radius:50%;flex:none}
.op .nm{flex:1;line-height:1.3}
.op .nm small{display:block;font-size:10px;color:var(--humo);margin-top:1px}
.op .kc{font-family:var(--m);font-size:10.5px;color:var(--humo);flex:none;text-align:right;line-height:1.35}
.op .kc em{font-style:normal;color:var(--azul)}
.prop{margin-top:11px;padding:12px;background:#F7FAFD;border:1px solid #DCE7F2;border-radius:12px}
.prop .pz{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.prop .pl{width:44px;height:44px;flex:none}
.prop .pl svg{display:block;width:44px;height:44px}
.prop .pt2 b{font-family:var(--d);font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
color:var(--humo);display:block}
.prop .pt2 span{font-family:var(--m);font-size:12.5px;display:block;margin-top:2px}
.prop .pt2 span em{font-style:normal;color:var(--azul);font-weight:600}
.prop ul{list-style:none;margin-bottom:9px}
.prop ul li{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;line-height:1.45;padding:2px 0}
.prop ul li i{width:7px;height:7px;border-radius:50%;flex:none;margin-top:6px}
.prop ul li .pr{color:var(--humo);font-size:11px}
.prop ul li .et{display:block;font-family:var(--d);font-size:8px;font-weight:700;letter-spacing:.09em;
text-transform:uppercase;color:#93A0B3;margin-top:1px}
.prop ul li .et.tu{color:var(--azul)}
.prop .avi{font-size:11px;color:#5A6273;line-height:1.5;padding-left:8px;border-left:2px solid var(--maiz);
margin-bottom:10px}
.campo{margin-bottom:10px}
.campo label{display:block;font-family:var(--d);font-size:10px;font-weight:700;letter-spacing:.1em;
text-transform:uppercase;color:var(--humo);margin-bottom:4px}
.campo input,.campo select{width:100%;padding:10px 11px;border:1.5px solid var(--linea);border-radius:10px;
background:var(--bl);font-family:var(--t);font-size:15px;color:var(--tinta)}
.campo input[inputmode=numeric]{font-family:var(--m)}
.campo small{display:block;font-size:10.5px;color:var(--humo);margin-top:3px;line-height:1.4}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.avisoc{background:#FFF8E8;border:1px solid #F0DFB5;border-radius:11px;padding:11px;font-size:11.5px;
line-height:1.55;color:#6B5320;margin:12px 0}
.avisoc b{color:#4A3812}
details{border-bottom:1px solid var(--linea)}
summary{padding:12px 2px;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;
font-family:var(--d);font-size:13px;font-weight:700}
summary::-webkit-details-marker{display:none}
summary .fl{margin-left:auto;color:var(--humo);transition:transform .2s}
details[open] summary .fl{transform:rotate(90deg)}
details .cu{padding:0 2px 13px;font-size:12.5px;line-height:1.55;color:#33415A}
details .cu p{margin-bottom:8px}
.kv{display:flex;justify-content:space-between;gap:9px;padding:6px 0;border-bottom:1px dashed var(--linea);font-size:12px}
.kv:last-child{border-bottom:0}
.kv .vv{font-family:var(--m);font-weight:600;flex:none}
.kv .vv.mal{color:var(--barro)}.kv .vv.bien{color:var(--nopal)}

/* ---------- barra inferior ---------- */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.97);
backdrop-filter:blur(12px);border-top:1px solid var(--linea);z-index:40;
padding:6px 0 max(6px,env(safe-area-inset-bottom))}
nav button{background:none;border:0;cursor:pointer;padding:4px 2px;display:flex;flex-direction:column;
align-items:center;gap:3px;color:var(--humo);font-family:var(--d);font-size:9px;font-weight:700;
letter-spacing:.06em;text-transform:uppercase}
nav button[aria-selected=true]{color:var(--tinta)}
nav button svg{width:20px;height:20px;stroke-width:1.7;fill:none;stroke:currentColor}
nav button[aria-selected=true] svg{stroke-width:2.4}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="tel">

<header class="top">
  <svg class="tile" aria-hidden="true"><defs><pattern id="az" width="42" height="42" patternUnits="userSpaceOnUse">
    <g fill="none" stroke="#5E92C8" stroke-width="1" opacity=".5">
      <path d="M21 6 L28 13 L21 20 L14 13 Z"/><circle cx="21" cy="13" r="2.4" fill="#5E92C8" stroke="none"/>
      <path d="M0 34 L8 42 M42 34 L34 42 M0 8 L8 0 M42 8 L34 0"/></g></pattern></defs>
    <rect width="100%" height="100%" fill="url(#az)"/></svg>

  <div class="fila1">
    <div class="nav-d">
      <button id="ant" aria-label="Día anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="fecha" id="fecha-l">—<small id="fecha-s"></small></div>
      <button id="sig" aria-label="Día siguiente"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <button class="sync" id="btn-aj" aria-label="Ajustes">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg>
      <span class="pt no" id="pt"></span>
    </button>
  </div>

  <div class="panel">
    <div class="ring">
      <svg width="58" height="58" viewBox="0 0 58 58">
        <circle cx="29" cy="29" r="24" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="6"/>
        <circle id="arco-p" cx="29" cy="29" r="24" fill="none" stroke="rgba(255,255,255,.34)" stroke-width="6"
                stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="150.8"/>
        <circle id="arco" cx="29" cy="29" r="24" fill="none" stroke="#8FC5F5" stroke-width="6"
                stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="150.8"/>
      </svg>
      <div class="c"><span class="n" id="p-val">0</span><span class="u">g PROT</span></div>
    </div>
    <div class="med">
      <div class="l"><span>Calorías</span><span><b id="k-val">0</b> <span id="k-meta">de 1,800</span></span></div>
      <div class="bar"><i class="pla" id="k-pla" style="width:0%"></i><i class="com" id="k-com" style="width:0%"></i></div>
      <div class="frase" id="frase">Cargando…</div>
    </div>
  </div>
</header>

<main>
  <section class="vista on" id="v-dia"><div id="tiempos"></div></section>
  <section class="vista" id="v-semana">
    <h2 class="sec">Los próximos 7 días</h2>
    <div id="semana"></div>
    <p class="nota" style="margin-top:12px">Toca un día para planearlo. La barra azul es qué tanto de tu meta de proteína cubre lo que tienes planeado.</p>
  </section>
  <section class="vista" id="v-super">
    <h2 class="sec">Lo que necesitas comprar</h2>
    <div id="super"></div>
  </section>
</main>

<nav role="tablist">
  <button role="tab" aria-selected="true" data-v="dia">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Día</button>
  <button role="tab" aria-selected="false" data-v="semana">
    <svg viewBox="0 0 24 24"><path d="M4 19V9M9.3 19V5M14.7 19v-7M20 19v-4"/></svg>Semana</button>
  <button role="tab" aria-selected="false" data-v="super">
    <svg viewBox="0 0 24 24"><path d="M4 5h2l2.2 10.5a2 2 0 0 0 2 1.5h7.3a2 2 0 0 0 2-1.5L21 8H7"/><circle cx="10" cy="20" r="1.2"/><circle cx="18" cy="20" r="1.2"/></svg>Súper</button>
</nav>
</div>

<div class="sheet" id="sheet"><div class="fondo"></div><div class="panel2"><div class="asa"></div><div id="sc"></div></div></div>

<script>
/* ==================================================================
   MI DÍA · app de planeación de comidas
   Guarda todo en el teléfono y lo sube a Google Sheets cuando hay red.
   ================================================================== */

const META_DEF = {nombre:'Arturo',sexo:'hombre',edad:27,estatura:178,peso:84,peso_meta:75,
                  actividad:1.3,ritmo:550,prot_por_kg:1.8};

/* Catálogo de respaldo: la app arranca con esto aunque nunca haya

function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function suma(f,n){const d=new Date(f+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)}
function bonito(f){
  const d=new Date(f+'T12:00:00');
  const dd=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][d.getDay()];
  const mm=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][d.getMonth()];
  return dd+' '+d.getDate()+' '+mm;
}
function etiquetaDia(f){
  if(f===hoy)return'Hoy'; if(f===suma(hoy,1))return'Mañana'; if(f===suma(hoy,-1))return'Ayer';
  return f>hoy?'En '+Math.round((new Date(f)-new Date(hoy))/864e5)+' días':'';
}

/* ================= METAS ================= */
function metas(){
  const p=E.perfil, pe=+p.peso||84, es=+p.estatura||178, ed=+p.edad||27;
  const base=(String(p.sexo).toLowerCase().startsWith('m')&&String(p.sexo).toLowerCase()!=='masculino')
    ? 10*pe+6.25*es-5*ed-161 : 10*pe+6.25*es-5*ed+5;
  const gasto=base*(+p.actividad||1.3);
  const kcal=Math.max(1300,Math.round((gasto-(+p.ritmo||550))/10)*10);
  const prot=Math.round((+p.peso_meta||75)*(+p.prot_por_kg||1.8));
  return {gasto:Math.round(gasto),kcal,prot};
}

const porCat=c=>E.alimentos.filter(a=>a.categoria===c&&a.nombre);
const buscar=n=>E.alimentos.find(a=>a.nombre===n)
               ||E.alimentos.find(a=>String(a.nombre).toLowerCase()===String(n).toLowerCase());
const nulos={des_carbo:'Sin pan',carbohidrato:'Sin arroz ni pan'};

/* ================= MOTOR DE PLATOS ================= */
function ideas(T,elegidos){
  if(!elegidos.length) return [];
  const M=metas(), min=M.kcal*T.fk[0], max=M.kcal*T.fk[1], metaP=M.prot*T.fp;
  if(T.solo) return elegidos.map(n=>{const a=buscar(n);return{comb:[n],k:+a.kcal,p:+a.proteina}});

  const listas=[elegidos].concat(T.relleno.map(c=>{
    const l=porCat(c).map(a=>a.nombre);
    if(nulos[c]&&!l.includes(nulos[c])) l.push(nulos[c]);
    if(!nulos[c]) l.push('');
    return l;
  }));
  let out=[[]];
  listas.forEach(l=>{out=out.flatMap(p=>l.map(x=>[...p,x]))});

  const FAMS=['pollo','atún','huevo','frijol','requesón','panela','soya','lenteja'];
  const sinRepetir=cs=>{const v=[];
    for(const n of cs)for(const f of FAMS)if(n.toLowerCase().includes(f)){if(v.includes(f))return false;v.push(f)}
    return true};
  const todas=out.map(c=>{
    const cs=c.filter(x=>x&&buscar(x)&&+buscar(x).kcal>0);
    let k=0,p=0; cs.forEach(n=>{const a=buscar(n);k+=+a.kcal;p+=+a.proteina});
    return {comb:cs,k,p};
  }).filter(x=>x.comb.length&&sinRepetir(x.comb));

  let r=[];
  for(const meta of [metaP,metaP-6,metaP-12,metaP-18,0]){
    r=todas.filter(x=>x.k>=min&&x.k<=max&&x.p>=meta);
    if(r.length) break;
  }
  if(!r.length) r=todas.filter(x=>x.k<=max).sort((a,b)=>b.p-a.p).slice(0,8);

  const pos=n=>E.alimentos.findIndex(a=>a.nombre===n);
  r.sort((a,b)=>a.comb.length-b.comb.length||Math.round(a.p/5)-Math.round(b.p/5)||a.k-b.k
    ||a.comb.reduce((s,n)=>s+pos(n),0)-b.comb.reduce((s,n)=>s+pos(n),0));
  const vistos=new Set(),fin=[];
  r.forEach(x=>{const k=x.comb.slice(1).join('|');if(!vistos.has(k)){vistos.add(k);fin.push(x)}});
  return fin;
}

function platoSVG(comb,tam){
  tam=tam||44; const c=tam/2, rr=tam*.42;
  const partes=comb.map(n=>({f:FAM(buscar(n).categoria),k:+buscar(n).kcal})).filter(x=>x.k>0);
  const tot=partes.reduce((a,b)=>a+b.k,0)||1;
  let ang=0,seg='';
  partes.forEach(x=>{
    const a=x.k/tot*360,r1=(ang-90)*Math.PI/180,r2=(ang+a-90)*Math.PI/180,big=a>180?1:0;
    seg+=`<path d="M${c} ${c} L${c+rr*Math.cos(r1)} ${c+rr*Math.sin(r1)} A${rr} ${rr} 0 ${big} 1 ${c+rr*Math.cos(r2)} ${c+rr*Math.sin(r2)} Z" fill="${COLOR[x.f]}" opacity=".9"/>`;
    ang+=a;
  });
  return `<svg viewBox="0 0 ${tam} ${tam}"><circle cx="${c}" cy="${c}" r="${c-1}" fill="#fff" stroke="var(--linea)"/>${seg}<circle cx="${c}" cy="${c}" r="${rr}" fill="none" stroke="#fff" stroke-width="1.4"/></svg>`;
}

/* ================= SINCRONIZACIÓN ================= */
function pintarSync(){
  const pt=document.getElementById('pt');
  pt.className='pt '+(!URL_BD?'no':COLA.length?'esp':'ok');
}
async function sincronizar(forzar){
  if(!URL_BD||sincronizando||!navigator.onLine) {pintarSync();return}
  sincronizando=true; pintarSync();
  try{
    if(COLA.length){
      const lote=COLA.slice(0,80);
      const res=await fetch(URL_BD,{method:'POST',redirect:'follow',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({ops:lote})});
      const j=await res.json();
      if(j.ok){const ok=new Set(j.aplicadas||[]);COLA=COLA.filter(o=>!ok.has(o.uid))}
    }
    if(forzar||!LS.get('ultima',0)||Date.now()-LS.get('ultima',0)>6e5){
      const res=await fetch(URL_BD+'?action=bootstrap',{redirect:'follow'});
      const j=await res.json();
      if(j.ok){
        if(j.alimentos&&j.alimentos.length) E.alimentos=j.alimentos;
        if(j.perfil&&Object.keys(j.perfil).length) E.perfil={...META_DEF,...j.perfil};
        if(j.peso&&j.peso.length) E.peso=j.peso;
        // Mezcla por uid, nunca reemplaza: así una respuesta vacía o a medias
        // del servidor jamás te borra lo que ya tienes guardado en el teléfono.
        const pend=new Set(COLA.map(o=>o.uid));
        const mezclar=(local,servidor)=>{
          const m=new Map();
          (local||[]).forEach(r=>m.set(r.uid,r));        // lo del teléfono
          (servidor||[]).forEach(r=>m.set(r.uid,r));     // el servidor lo pisa
          (local||[]).filter(r=>pend.has(r.uid))         // salvo lo que sigue sin subir
                     .forEach(r=>m.set(r.uid,r));
          return [...m.values()];
        };
        E.registro=mezclar(E.registro,j.registro).filter(r=>r.estado!=='borrado');
        E.favoritos=mezclar(E.favoritos,j.favoritos);
        LS.set('ultima',Date.now());
      }
    }
    guardar(); pintar();

function pintarDia(){
  const M=metas();
  document.getElementById('tiempos').innerHTML=TIEMPOS.map(T=>{
    const rs=delDia(dia).filter(r=>r.tiempo===T.id);
    const k=rs.reduce((a,b)=>a+ +b.kcal,0), p=rs.reduce((a,b)=>a+ +b.proteina,0);
    const items=rs.map(r=>`<div class="it ${r.estado==='comido'?'comido':''}">
        <button class="tick" data-tick="${r.uid}" aria-label="Marcar como comido">
          <svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></button>
        <div class="it-t" data-edit="${r.uid}">
          <b>${r.descripcion}${r.estado==='planeado'?'<span class="eti">planeado</span>':''}</b>
          <span>${r.kcal} kcal · <em>${r.proteina} g</em></span></div></div>`).join('');
    return `<section class="tiempo ${rs.length?'full':''}">
      <div class="t-cab">
        <div class="t-ico"><svg viewBox="0 0 24 24">${T.ico}</svg></div>
        <div class="t-tit"><b>${T.nom}</b><span>${T.hora}</span></div>
        <div class="t-num">${rs.length?`${k}<br><em>${p} g</em>`:''}</div>
      </div>
      ${items?`<div class="items">${items}</div>`:''}
      <button class="add" data-add="${T.id}">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>${rs.length?'Agregar otra cosa':'Agregar'}</button>
    </section>`;
  }).join('');

  const t=totales(dia);
  document.getElementById('fecha-l').childNodes[0].nodeValue=bonito(dia);
  document.getElementById('fecha-s').textContent=etiquetaDia(dia);
  document.getElementById('p-val').textContent=dia>hoy?t.pp:t.pc;
  document.getElementById('k-val').textContent=(dia>hoy?t.kp:t.kc).toLocaleString('es-MX');
  document.getElementById('k-meta').textContent='de '+M.kcal.toLocaleString('es-MX');
  document.getElementById('k-com').style.width=Math.min(100,t.kc/M.kcal*100)+'%';
  document.getElementById('k-pla').style.width=Math.min(100,t.kp/M.kcal*100)+'%';
  document.getElementById('k-com').classList.toggle('pas',t.kc>M.kcal*1.06);
  document.getElementById('arco').style.strokeDashoffset=150.8*(1-Math.min(1,t.pc/M.prot));
  document.getElementById('arco-p').style.strokeDashoffset=150.8*(1-Math.min(1,t.pp/M.prot));
  document.getElementById('frase').innerHTML=frase(t,M);
}
function frase(t,M){
  if(dia>hoy){
    if(!t.n) return 'Día sin planear. Ve agregando lo que quieras comer.';
    if(t.pp<M.prot*.9) return `Planeado: faltan <b>${M.prot-t.pp} g</b> de proteína.`;
    if(t.kp>M.kcal*1.06) return 'Planeado: vas arriba de calorías. Quita un carbohidrato.';
    return 'Día planeado y bien armado.';
  }
  if(!t.n) return 'Nada registrado todavía.';
  const falta=M.prot-t.pc, pend=t.n-delDia(dia).filter(r=>r.estado==='comido').length;
  if(pend) return `Te faltan <b>${pend}</b> por confirmar. Tócalas cuando te las comas.`;
  if(falta>12) return `Te faltan <b>${falta} g</b> de proteína. Un atún son 24 g.`;
  if(t.kc>M.kcal*1.06) return 'Te pasaste de calorías. Cuenta el promedio de la semana, no el día.';
  return '<b>Buen día.</b> Proteína cubierta sin pasarte.';
}

function pintarSuper(){
  const cuenta={};
  for(let i=0;i<7;i++){
    delDia(suma(hoy,i)).forEach(r=>{
      String(r.descripcion).split(' · ').forEach(n=>{
        const a=buscar(n.trim()); if(!a||!a.ingredientes)return;
        String(a.ingredientes).split(',').forEach(g=>{
          g=g.trim().toLowerCase(); if(!g)return; cuenta[g]=(cuenta[g]||0)+1;
        });
      });
    });
  }
  const lista=Object.entries(cuenta).sort((a,b)=>b[1]-a[1]);
  const cont=document.getElementById('super');
  if(!lista.length){
    cont.innerHTML=`<div class="vacio"><b>Nada que comprar todavía</b>
      Planea algunos días en la pestaña Semana y aquí aparecen los ingredientes que vas a necesitar.</div>`;
    return;

  cont.innerHTML=`<div class="listaing">${lista.map(([g,n])=>
    `<div class="ing ${MARCA[g]?'ok':''}" data-ing="${g}"><span class="bx">
      <svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></span>

  if(b=g('[data-sel]')){const n=b.dataset.sel;SH.sel.has(n)?SH.sel.delete(n):SH.sel.add(n);SH.idx=0;pintarAgregar();return}
  if(b=g('[data-otra]')){SH.idx++;pintarAgregar();return}
  if(b=g('[data-poner]')){
    const pr=ideas(SH.T,[...SH.sel]), p=pr[SH.idx%pr.length];
    agregar(dia,SH.T.id,p.comb.map(n=>n.replace(/^\+ /,'')).join(' · '),p.k,p.p);
    guardar();cerrar();pintar();return}
  if(b=g('[data-guardar]')){
    const pr=ideas(SH.T,[...SH.sel]), p=pr[SH.idx%pr.length];
    const f={uid:uid(),tiempo:SH.T.id,nombre:p.comb[0],
             detalle:p.comb.map(n=>n.replace(/^\+ /,'')).join(' · '),kcal:p.k,proteina:p.p,veces:0};
    E.favoritos.push(f);encolar({tipo:'favorito',...f});
    agregar(dia,SH.T.id,f.detalle,p.k,p.p);guardar();cerrar();pintar();return}
  if(b=g('[data-fav]')){
    const f=E.favoritos.find(x=>x.uid===b.dataset.fav);
    f.veces=(+f.veces||0)+1; encolar({tipo:'favorito',...f});
    agregar(dia,f.tiempo,f.detalle,f.kcal,f.proteina);guardar();cerrar();pintar();return}
  if(b=g('[data-rap]')){
    const a=buscar(b.dataset.rap);
    agregar(dia,SH.T.id,a.nombre,+a.kcal,+a.proteina);guardar();cerrar();pintar();return}
  if(b=g('[data-otro]')){
    const n=document.getElementById('o-n').value.trim();
    if(!n){document.getElementById('o-n').focus();return}
    agregar(dia,SH.T.id,n,+document.getElementById('o-k').value||0,+document.getElementById('o-p').value||0);
    guardar();cerrar();pintar();return}
  if(b=g('[data-eg]')){
    cambiar(b.dataset.eg,{descripcion:document.getElementById('e-n').value.trim(),
      kcal:+document.getElementById('e-k').value||0,proteina:+document.getElementById('e-p').value||0,
      tiempo:document.getElementById('e-t').value,estado:document.getElementById('e-s').value});
    guardar();cerrar();pintar();return}
  if(b=g('[data-eb]')){cambiar(b.dataset.eb,{estado:'borrado'});
    E.registro=E.registro.filter(r=>r.uid!==b.dataset.eb||r.estado==='borrado');
    guardar();cerrar();pintar();return}

  if(g('#a-guardar')){
    const v=id=>document.getElementById(id).value;
    const pesoNuevo=+v('a-peso')||E.perfil.peso;
    const cambios={peso:pesoNuevo,peso_meta:+v('a-meta')||75,edad:+v('a-edad')||27,
                   estatura:+v('a-est')||178,actividad:+v('a-act'),ritmo:+v('a-rit')};
    Object.assign(E.perfil,cambios);
    Object.entries(cambios).forEach(([k,val])=>encolar({tipo:'perfil',uid:'perfil-'+k,clave:k,valor:val}));
    encolar({tipo:'peso',uid:'peso-'+hoy,fecha:hoy,kg:pesoNuevo,nota:''});
    guardar();cerrar();pintar();return}
  if(g('#a-url-g')){URL_BD=document.getElementById('a-url').value.trim();LS.set('url',URL_BD);
    pintarSync();sincronizar(true);cerrar();return}
  if(g('#a-sync')){sincronizar(true);cerrar();return}
  if(g('#a-probar')){
    const u=document.getElementById('a-url').value.trim(), btn=document.getElementById('a-probar');
    btn.textContent='Probando…';
    fetch(u+'?action=ping',{redirect:'follow'}).then(r=>r.json())
      .then(j=>{btn.textContent=j.ok?'Funciona ✓':'Respondió raro'})
      .catch(()=>{btn.textContent='No conectó'});
    return}
  if(g('#limpiar-m')){MARCA={};LS.set('marcados',MARCA);pintarSuper();return}
});

/* ================= EVENTOS ================= */
document.getElementById('tiempos').addEventListener('click',e=>{
  let b;
  if(b=e.target.closest('[data-tick]')){
    const r=E.registro.find(x=>x.uid===b.dataset.tick);
    cambiar(r.uid,{estado:r.estado==='comido'?'planeado':'comido'});guardar();pintar();return}
  if(b=e.target.closest('[data-edit]')){abrirEditar(b.dataset.edit);return}
  if(b=e.target.closest('[data-add]')){abrirAgregar(b.dataset.add);return}
});
document.getElementById('semana').addEventListener('click',e=>{
  const b=e.target.closest('[data-dia]'); if(!b)return;
  dia=b.dataset.dia; irA('dia');
});
document.getElementById('super').addEventListener('click',e=>{
  const b=e.target.closest('[data-ing]'); if(!b)return;
  const g=b.dataset.ing; MARCA[g]=!MARCA[g]; LS.set('marcados',MARCA); pintarSuper();
});
document.getElementById('ant').onclick=()=>{dia=suma(dia,-1);pintar()};
document.getElementById('sig').onclick=()=>{dia=suma(dia,1);pintar()};
document.getElementById('fecha-l').onclick=()=>{dia=hoy;pintar()};
document.getElementById('btn-aj').onclick=abrirAjustes;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>irA(b.dataset.v));
function irA(v){
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x.dataset.v===v));
  document.querySelectorAll('.vista').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  pintar(); window.scrollTo({top:0});
}

/* ================= ARRANQUE ================= */
function pintar(){pintarDia();pintarSemana();pintarSuper();pintarSync()}
pintar();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
sincronizar(true);
setInterval(()=>{const h=fechaHoy();if(h!==hoy){hoy=h;dia=h;pintar()}},60000);
</script>
</body>
</html>
